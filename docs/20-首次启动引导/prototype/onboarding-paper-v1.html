<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>FCLUI 魔改 · 首次启动引导（米黄纸质）</title>
<style>
/* ==========================================================================
   首次启动引导 · 三屏
   --------------------------------------------------------------------------
   正文文案：只使用三句原文，逐字不改（docs/20/README.md §2.1）
             1 欢迎使用 fclui 魔改
             2 我们是来自社区自发组织的修改
             3 人员名单
   纸色：米黄（warm cream），非 V2 原 token 的暖灰；见 README §4 的说明
   纸感：暖色织纹 + feTurbulence 颗粒 + 顶部提亮/底部压暗
   ========================================================================== */
:root{
  color-scheme: light;

  /* 米黄纸 */
  --paper-0:#F8F2E3;   /* 纸面顶部 */
  --paper-1:#F2EAD7;   /* 纸面中部 */
  --paper-2:#E8DDC4;   /* 纸面底部 / 纸边 */
  --card:#FCF8EE;      /* 纸卡 */

  /* 墨（沿用 V2，未改） */
  --ink:#2C2E28; --ink-2:#55584C; --ink-3:#5F6256;

  /* 苔墨（沿用 V2） */
  --accent:#7F9470; --accent-ink:#4C6143; --accent-wash:#E2E7D8; --on-accent:#F8F3E7;

  /* 线与状态层：随纸色一起转暖，否则在米黄上会发灰 */
  --line:rgba(122,104,72,.16);
  --line-strong:rgba(122,104,72,.26);
  --focus-color:var(--accent-ink);
  --pressed-overlay:rgba(122,104,72,.07);
  --pressed-overlay-strong:rgba(122,104,72,.11);

  /* 插画色（只在 SVG 里用） */
  --art-rust:#B0765A; --art-amber:#C99A55; --art-sage:#8FA37C;
  --art-olive:#78886B; --art-deep:#5E6E56; --art-soil:#8A6F55; --art-cloud:#FDF8EA;

  --font-family:system-ui,-apple-system,"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  --text-display-size:32px; --text-display-line:40px;
  --text-body-size:16px;    --text-body-line:24px;
  --text-label-size:14px;   --text-label-line:20px;

  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px;
  --space-5:20px; --space-6:24px; --space-7:32px; --space-8:40px;

  --radius-thumb:12px; --radius-row:16px; --radius-postcard:20px;
  --radius-bar:28px; --radius-pill:999px;

  --layout-width:390px; --layout-height:844px;
  --content-inset:16px; --status-height:44px;

  --duration-press:120ms; --duration-ui:240ms; --duration-enter:480ms;
  --ease-out:cubic-bezier(.23,1,.32,1);
}

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  font-family:var(--font-family);
  background:var(--paper-2);
  display:grid;place-items:center;
  -webkit-font-smoothing:antialiased;
}

/* ---------- 机身 ---------- */
.stage{
  position:relative;
  width:var(--layout-width); height:var(--layout-height);
  overflow:hidden;
  border-radius:var(--radius-bar);
  background:linear-gradient(178deg,var(--paper-0) 0%,var(--paper-1) 52%,var(--paper-2) 100%);
  box-shadow:0 30px 80px rgba(92,76,46,.20), 0 0 0 1px var(--line);
  display:grid;
  grid-template-rows:var(--status-height) auto minmax(0,1fr) auto;
  isolation:isolate;
}

/* 纸纹 1：细密织纹（经纬两个方向，间距 3–4px） */
.fiber{
  position:absolute; inset:0; z-index:0; pointer-events:none; opacity:.62;
  background-image:
    repeating-linear-gradient(0deg,  rgba(146,122,82,.050) 0 1px, transparent 1px 3px),
    repeating-linear-gradient(90deg, rgba(146,122,82,.022) 0 1px, transparent 1px 5px);
}
/* 纸纹 2：颗粒（feTurbulence 灰噪声，multiply 压到很淡） */
.grain{
  position:absolute; inset:0; z-index:0; pointer-events:none;
  opacity:.20; mix-blend-mode:multiply;
  background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='180' height='180'%3E%3Cfilter id='g'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3CfeColorMatrix type='saturate' values='0'/%3E%3C/filter%3E%3Crect width='180' height='180' filter='url(%23g)' opacity='0.6'/%3E%3C/svg%3E");
  background-size:180px 180px;
}
/* 纸纹 3：顶部提亮 + 底部压暗，做出"一页纸"的弧度 */
.vignette{
  position:absolute; inset:0; z-index:0; pointer-events:none;
  background:
    radial-gradient(125% 72% at 50% -12%, rgba(255,251,238,.85), transparent 62%),
    radial-gradient(105% 62% at 50% 112%, rgba(126,104,66,.13), transparent 60%);
}
.watermark{position:absolute;left:0;right:0;bottom:0;z-index:0;pointer-events:none;opacity:.5}
.watermark svg{display:block;width:100%;height:auto}

/* ---------- 仿制状态栏（仅设计稿） ---------- */
.statusbar{
  position:relative; z-index:2;
  display:flex; align-items:center; justify-content:space-between;
  padding:0 var(--space-5) 0 var(--space-6);
  font-size:var(--text-label-size); line-height:var(--text-label-line);
  font-weight:600; color:var(--ink);
}
.statusbar .glyphs{display:flex; align-items:center; gap:6px}
.signal{display:flex; align-items:flex-end; gap:2px; height:11px}
.signal i{display:block;width:3px;border-radius:1px;background:currentColor;opacity:.88}
.signal i:nth-child(1){height:4px}
.signal i:nth-child(2){height:6px}
.signal i:nth-child(3){height:8.5px}
.signal i:nth-child(4){height:11px}
.wifi{position:relative;width:16px;height:12px;overflow:hidden}
.wifi i{position:absolute;left:50%;transform:translateX(-50%);border-radius:50%;
        border:1.7px solid transparent;border-top-color:currentColor;opacity:.88}
.wifi i:nth-child(1){width:17px;height:17px;top:0}
.wifi i:nth-child(2){width:11px;height:11px;top:2.5px}
.wifi .wdot{position:absolute;left:50%;transform:translateX(-50%);bottom:1px;
            width:3px;height:3px;border-radius:50%;background:currentColor;opacity:.88}
.battery{position:relative;width:24px;height:12px;padding:1.5px;
         border:1px solid rgba(44,46,40,.45);border-radius:3.5px}
.battery::after{content:"";position:absolute;right:-3px;top:3.5px;width:2px;height:5px;
                border-radius:0 1px 1px 0;background:rgba(44,46,40,.45)}
.battery .level{display:block;width:78%;height:100%;border-radius:2px;background:currentColor;opacity:.85}

/* ---------- 顶栏：关闭 ---------- */
.topbar{
  position:relative; z-index:2;
  display:flex; align-items:center; justify-content:flex-end;
  padding:0 var(--content-inset);
  min-height:44px;
}
.close{
  appearance:none;border:0;background:transparent;
  width:44px;height:44px;border-radius:var(--radius-thumb);
  position:relative; cursor:pointer; color:var(--ink-3);
  transition:background-color var(--duration-press) linear,color var(--duration-press) linear;
}
.close i{
  position:absolute;left:50%;top:50%;width:15px;height:1.9px;margin:-.95px 0 0 -7.5px;
  background:currentColor;border-radius:2px;
}
.close i:first-child{transform:rotate(45deg)}
.close i:last-child{transform:rotate(-45deg)}
.close:hover{background:var(--pressed-overlay);color:var(--ink-2)}
.close:active{background:var(--pressed-overlay-strong)}
.close:focus-visible{outline:2px solid var(--focus-color);outline-offset:3px}

/* ---------- 三屏 ---------- */
.screens{position:relative;z-index:1;display:grid;min-height:0}
.screen{
  grid-area:1/1;
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  padding:0 var(--content-inset);
  min-height:0;
  opacity:0; visibility:hidden; transform:translateY(16px);
  transition:opacity var(--duration-ui) linear,
             transform var(--duration-enter) var(--ease-out),
             visibility 0s linear var(--duration-ui);
}
.screen.is-active{
  opacity:1; visibility:visible; transform:none;
  transition:opacity var(--duration-ui) linear,
             transform var(--duration-enter) var(--ease-out),
             visibility 0s;
}
.screen.is-leaving{transform:translateY(-8px)}

.art{flex:0 0 auto;display:grid;place-items:center;padding-bottom:var(--space-7)}
.art svg{display:block;width:238px;height:auto}
.screen[data-i="2"] .art{padding-bottom:var(--space-6)}
.screen[data-i="2"] .art svg{width:204px}

.line{
  margin:0;
  max-width:280px;
  font-size:var(--text-display-size); line-height:var(--text-display-line);
  font-weight:600; color:var(--ink);
  letter-spacing:0; text-align:center; text-wrap:balance;
}
.screen[data-i="2"] .line{padding-bottom:var(--space-7)}

/* 名单骨架（无文字） */
.roster{
  width:min(268px,100%);
  display:grid; gap:var(--space-3);
  margin:0; padding:0; list-style:none;
}
.roster li{display:grid;grid-template-columns:34px 1fr;gap:var(--space-3);align-items:center}
.sk-avatar{
  width:34px;height:34px;border-radius:var(--radius-thumb);
  border:1px dashed var(--line-strong);
  background:rgba(146,122,82,.05);
}
.sk-name{height:12px;border-radius:var(--radius-pill);background:var(--line-strong);opacity:.55}
.roster li:nth-child(1) .sk-name{width:78%}
.roster li:nth-child(2) .sk-name{width:96%}
.roster li:nth-child(3) .sk-name{width:68%}
.roster li:nth-child(4) .sk-name{width:88%}

/* ---------- 底部 ---------- */
.foot{
  position:relative; z-index:2;
  padding:var(--space-4) var(--content-inset) calc(var(--space-6) + env(safe-area-inset-bottom,0px));
  display:grid; gap:var(--space-4);
  background:linear-gradient(180deg, rgba(242,234,215,0) 0%, rgba(242,234,215,.92) 44%, var(--paper-2) 100%);
}
.dots{display:flex;align-items:center;justify-content:center;gap:var(--space-2);height:10px}
.dot{
  width:8px;height:8px;border-radius:var(--radius-pill);
  background:rgba(122,104,72,.24);
  transition:width 260ms var(--ease-out), background-color var(--duration-ui) linear;
}
.dot.is-on{width:24px;background:var(--accent-ink)}

.actions{display:flex;align-items:center;gap:var(--space-3)}
.btn{
  appearance:none;border:0;margin:0;font:inherit;letter-spacing:0;
  border-radius:var(--radius-pill);cursor:pointer;min-height:52px;
  display:inline-flex;align-items:center;justify-content:center;
  transition:transform var(--duration-press) var(--ease-out),
             background-color var(--duration-press) linear,
             color var(--duration-press) linear,
             box-shadow var(--duration-press) linear;
}
.btn:focus-visible{outline:2px solid var(--focus-color);outline-offset:3px}
.btn:active{transform:scale(.985)}
.btn-primary{
  flex:1 1 auto;padding:0 var(--space-6);
  background:var(--accent-ink);color:var(--on-accent);
  font-size:var(--text-body-size);line-height:1;font-weight:500;
  box-shadow:0 10px 24px rgba(76,97,67,.20);
}
.btn-primary:hover{background:#435638}
.btn-primary:active{box-shadow:0 4px 12px rgba(76,97,67,.22)}
.btn-ghost{
  flex:0 0 auto;min-width:88px;padding:0 var(--space-4);
  background:transparent;color:var(--ink-2);
  font-size:var(--text-label-size);line-height:var(--text-label-line);font-weight:500;
}
.btn-ghost:hover{background:var(--pressed-overlay);color:var(--ink)}
.btn-ghost[hidden]{display:none}

/* ---------- 响应式 ---------- */
@media (max-width:430px), (max-height:860px){
  body{display:block;background:var(--paper-0);height:100%}
  .stage{width:100%;height:100%;border-radius:0;box-shadow:none}
}
@media (max-height:700px){
  .art svg{width:164px}
  .art{padding-bottom:var(--space-5)}
  .line{font-size:28px;line-height:36px}
  .roster{gap:var(--space-2)}
}

@media (prefers-reduced-motion:reduce){
  .screen,.screen.is-active,.screen.is-leaving{transform:none!important;transition:opacity 200ms linear,visibility 0s}
  .btn:active{transform:none}
  .dot{transition:background-color 200ms linear}
}
</style>
</head>

  <div class="watermark" aria-hidden="true">

      <path d="M0 108 L64 70 L112 94 L164 58 L214 100 L268 68 L322 102 L390 74 L390 120 L0 120 Z" fill="var(--art-olive)" opacity=".13"/>

  <div class="topbar">
    <button class="close" id="skip" type="button" aria-label="跳过引导" title="跳过引导">
      <i></i><i></i>

  </div>

  <div class="screens">

    <!-- 第 1 屏：一张纸 + 苔墨印章 + 冒出来的新芽 -->
    <section class="screen is-active" data-i="0" aria-labelledby="obTitle">
      <div class="art" aria-hidden="true">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="30 12 168 152" fill="none">

            <path d="M166 120 l0 -17 l-17 17 z" fill="#E9DCC0" opacity=".85"/>

    <!-- 第 2 屏：一圈人，头+身，手拉手 -->

        </svg>
      </div>
      <h1 class="line" id="s3Title">人员名单</h1>
      <ul class="roster" aria-hidden="true">
        <li><span class="sk-avatar"></span><span class="sk-name"></span></li>
        <li><span class="sk-avatar"></span><span class="sk-name"></span></li>
        <li><span class="sk-avatar"></span><span class="sk-name"></span></li>
        <li><span class="sk-avatar"></span><span class="sk-name"></span></li>
      </ul>
    </section>

  </div>

  <footer class="foot" id="foot">
    <div class="dots" id="dots" aria-label="引导进度">
      <span class="dot is-on"></span>
      <span class="dot"></span>
      <span class="dot"></span>
    </div>
    <div class="actions">
      <button class="btn btn-ghost" id="back" type="button" hidden>上一步</button>
      <button class="btn btn-primary" id="next" type="button">下一步</button>
    </div>
  </footer>
</main>

<script>
const HOME = 'home-paper-v2.html';

const screens = [...document.querySelectorAll('.screen')];
const dots    = [...document.querySelectorAll('#dots .dot')];
const skipBtn = document.getElementById('skip');
const backBtn = document.getElementById('back');
const nextBtn = document.getElementById('next');

const NEXT_LABEL = ['下一步', '下一步', '开始使用'];
let index = 0;

function render() {
  screens.forEach((s, i) => {
    const on = i === index;
    s.classList.toggle('is-active', on);
    s.classList.toggle('is-leaving', i < index);
    s.setAttribute('aria-hidden', on ? 'false' : 'true');
  });
  dots.forEach((d, i) => d.classList.toggle('is-on', i === index));
  backBtn.hidden = index === 0;
  nextBtn.textContent = NEXT_LABEL[index];
}

function next() {
  if (index < screens.length - 1) { index += 1; render(); }
  else location.href = HOME;
}
function prev() { if (index > 0) { index -= 1; render(); } }

nextBtn.addEventListener('click', next);
backBtn.addEventListener('click', prev);
skipBtn.addEventListener('click', () => { location.href = HOME; });

document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight' || e.key === 'Enter') next();
  else if (e.key === 'ArrowLeft') prev();
  else if (e.key === 'Escape') location.href = HOME;
});

(function () {
  const s = Number(new URLSearchParams(location.search).get('s'));
  if (s >= 1 && s <= 3) index = s - 1;
})();
render();
</script>
</body>
</html>
